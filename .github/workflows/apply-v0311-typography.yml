name: Apply V0.3.11 HTML Typography Restoration

on:
  push:
    branches:
      - work/v0.3.11-html-typography
    paths:
      - tools/apply_v0311.py

permissions:
  contents: write

jobs:
  patch-build-promote:
    runs-on: windows-2022
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: work/v0.3.11-html-typography
          fetch-depth: 0

      - name: Apply V0.3.11 patch
        shell: pwsh
        run: python tools/apply_v0311.py

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "build\Release\Backrooms Offical.exe")) { throw "Backrooms Offical.exe was not produced" }
          if (!(Test-Path "build\Release\SDL3.dll")) { throw "SDL3.dll was not packaged" }

      - name: Promote one clean commit to main
        shell: pwsh
        run: |
          git fetch origin main
          $Expected = "71d7cdf81fb574f136d5495425b4081a3c45a3ba"
          $Actual = (git rev-parse origin/main).Trim()
          if ($Actual -ne $Expected) { throw "main moved while V0.3.11 was being prepared: $Actual" }

          Remove-Item "tools\apply_v0311.py" -Force
          Remove-Item ".github\workflows\apply-v0311-typography.yml" -Force

          git reset --soft origin/main
          git add -A
          git config user.name "spongebobtdgameplay-prog"
          git config user.email "spongebobtdgameplay@gmail.com"
          git commit -m "Restore original HTML typography and HUD styling in V0.3.11"
          git push origin HEAD:main
