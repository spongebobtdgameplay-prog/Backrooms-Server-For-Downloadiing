name: V0.3.27 Repaired Map Gate

on:
  push:
    branches:
      - feature-v0.3.27-map-waypoint-input
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v0327-repair-map-gate
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature-v0.3.27-map-waypoint-input
          fetch-depth: 0

      - name: Fetch V0.3.26 checkpoint
        run: git fetch origin checkpoint-v0.3.26-before-map-ui-input:refs/remotes/origin/checkpoint-v0.3.26-before-map-ui-input

      - name: Repair Game.cpp from checkpoint
        run: python3 tools/repair_v0327_game.py

      - name: Remove temporary repair files
        run: |
          rm -f tools/repair_v0327_game.py
          rm -f .github/workflows/v0327-repair-gate.yml

      - name: Commit repaired V0.3.27 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair V0.3.27 map input integration [skip ci]"
          git push origin HEAD:feature-v0.3.27-map-waypoint-input

  build-windows:
    needs: prepare
    runs-on: windows-2022
    steps:
      - name: Checkout repaired feature branch
        uses: actions/checkout@v4
        with:
          ref: feature-v0.3.27-map-waypoint-input

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Verify repaired V0.3.27 source
        shell: pwsh
        run: |
          if (!(Test-Path "build\Release\Backrooms Offical.exe")) { throw "Backrooms Offical.exe was not produced" }
          if (!(Select-String -Path "src\Game\Game.cpp" -Pattern 'void Game::HandleEvent' -Quiet)) { throw "HandleEvent missing" }
          if (!(Select-String -Path "src\Game\Game.cpp" -Pattern 'DrawFullMapV2' -Quiet)) { throw "V2 map integration missing" }
          if (!(Select-String -Path "src\Game\Game.cpp" -Pattern 'SetRandomWaypoint' -Quiet)) { throw "Random waypoint integration missing" }
          if (!(Select-String -Path "src\Rendering\MapOverlay.cpp" -Pattern 'THREAT NEAR' -Quiet)) { throw "Threat minimap alert missing" }
          if (!(Select-String -Path "src\Core\Application.cpp" -Pattern 'SDL_SetWindowFullscreen' -Quiet)) { throw "Fullscreen toggle missing" }
