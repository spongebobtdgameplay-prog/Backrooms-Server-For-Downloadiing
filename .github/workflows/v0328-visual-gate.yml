name: V0.3.28 Visual Polish Gate

on:
  push:
    branches:
      - feature-v0.3.28-visual-polish
    paths:
      - tools/v0328_visual_patch.py
      - .github/workflows/v0328-visual-gate.yml

permissions:
  contents: write

jobs:
  prepare-build:
    runs-on: windows-2022
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct prep literals
        shell: pwsh
        run: |
          $Path = "tools\v0328_visual_patch.py"
          $Text = Get-Content $Path -Raw
          $Text = $Text.Replace('updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)', 'updated, count = re.subn(pattern, lambda _: replacement, text, count=1, flags=re.S)')
          $Text = $Text.Replace('Hovered ? RouteColor : glm::vec3{0.43f, 0.39f, 0.18f}', 'Hovered ? glm::vec3{0.245f, 0.545f, 0.965f} : glm::vec3{0.43f, 0.39f, 0.18f}')
          $Text = $Text.Replace('"\xE2\x86\x90  BACK"', '"\\xE2\\x86\\x90  BACK"')
          Set-Content $Path $Text -NoNewline -Encoding utf8

      - name: Apply V0.3.28 visual pass
        shell: pwsh
        run: python tools/v0328_visual_patch.py

      - name: Verify source changes
        shell: pwsh
        run: |
          $Map = Get-Content "src\Rendering\MapOverlay.cpp" -Raw
          $Menu = Get-Content "src\Rendering\InteractiveMenu.cpp" -Raw
          $Version = Get-Content "src\Core\Version.h" -Raw
          if ($Map -match 'DotCount') { throw "Old dotted route code still present" }
          if ($Map -notmatch 'FillTriangle') { throw "Filled map markers were not added" }
          if ($Map -match 'TintIndex') { throw "Old patchwork cell tint remains" }
          if ($Menu -match 'const std::string Arrow = ">"') { throw "Old > arrow remains" }
          if ($Version -notmatch '0\.3\.28') { throw "Version was not bumped" }

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "build\Release\Backrooms Offical.exe")) {
            throw "Backrooms Offical.exe was not produced"
          }

      - name: Commit tested visual pass
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm ".github/workflows/v0328-visual-gate.yml" "tools/v0328_visual_patch.py"
          git add CMakeLists.txt src/Core/Version.h src/Platform/Windows/Backrooms.rc src/Rendering/MapOverlay.cpp src/Rendering/InteractiveMenu.cpp src/Rendering/SmoothTextRenderer.cpp src/Rendering/GameTextRenderer.cpp update/release_notes.txt
          git commit -m "Apply tested V0.3.28 map and menu visual polish [skip ci]"
          git push origin HEAD:feature-v0.3.28-visual-polish
