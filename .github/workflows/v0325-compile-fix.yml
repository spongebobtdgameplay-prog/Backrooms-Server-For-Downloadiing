name: V0.3.25 Compile Fix

on:
  push:
    branches:
      - v0.3.25-infinite-model-pass
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v0325-compile-fix
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: v0.3.25-infinite-model-pass
          fetch-depth: 0

      - name: Fix external texture byte loading
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          PathName = Path('src/Rendering/EntityModel.cpp')
          Content = PathName.read_text(encoding='utf-8')
          Pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*)std::vector<unsigned char> Bytes\(\s*\n'
              r'[ \t]*std::istreambuf_iterator<char>\(ImageFile\),\s*\n'
              r'[ \t]*std::istreambuf_iterator<char>\(\)\s*\n'
              r'[ \t]*\);'
          )
          Match = Pattern.search(Content)
          if Match is None:
              raise SystemExit('EntityModel iterator range declaration not found')
          Indent = Match.group('indent')
          Replacement = (
              f'{Indent}const std::istreambuf_iterator<char> Begin(ImageFile);\n'
              f'{Indent}const std::istreambuf_iterator<char> End;\n\n'
              f'{Indent}std::vector<unsigned char> Bytes(\n'
              f'{Indent}    Begin,\n'
              f'{Indent}    End\n'
              f'{Indent});'
          )
          Content = Pattern.sub(Replacement, Content, count=1)
          PathName.write_text(Content, encoding='utf-8', newline='\n')
          PY
          grep -q 'const std::istreambuf_iterator<char> Begin' src/Rendering/EntityModel.cpp
          ! grep -q 'std::istreambuf_iterator<char>()' src/Rendering/EntityModel.cpp

      - name: Commit compile fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v0325-compile-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix V0.3.25 external texture iterator construction [skip ci]"
          git push origin HEAD:v0.3.25-infinite-model-pass

  build-windows:
    needs: patch
    runs-on: windows-2022
    steps:
      - name: Checkout fixed feature branch
        uses: actions/checkout@v4
        with:
          ref: v0.3.25-infinite-model-pass
          fetch-depth: 1

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Verify V0.3.25 packaged runtime
        shell: pwsh
        run: |
          $Required = @(
            "build\Release\Backrooms Offical.exe",
            "build\Release\assets\models\exit-door.glb",
            "build\Release\assets\models\power_box_01\power_box_01_1k.gltf",
            "build\Release\assets\models\power_box_01\textures\power_box_01_diff_1k.jpg",
            "build\Release\assets\models\power_box_01\textures\power_box_01_nor_gl_1k.jpg",
            "build\Release\assets\models\power_box_01\textures\power_box_01_arm_1k.jpg",
            "build\Release\assets\audio\entity-metal.wav",
            "build\Release\assets\audio\entity-laugh.wav"
          )
          foreach ($Path in $Required) {
            if (!(Test-Path $Path)) {
              throw "Missing packaged runtime file: $Path"
            }
          }
          if ((Get-Content "src\Core\Version.h" -Raw) -notmatch '0\.3\.25') {
            throw "Version.h is not V0.3.25"
          }
          if ((Get-Content "CMakeLists.txt" -Raw) -notmatch 'VERSION 0\.3\.25') {
            throw "CMake project version is not V0.3.25"
          }
          if ((Get-Content "src\World\WorldGenerator.cpp" -Raw) -notmatch 'CreateChunkCells') {
            throw "Streamed chunk generator missing"
          }
          if ((Get-Content "src\Rendering\Renderer.cpp" -Raw) -notmatch 'ExitDoorModel\.Load') {
            throw "Real exit door model load missing"
          }
          if ((Get-Content "src\Audio\AudioSystem.cpp" -Raw) -notmatch 'PlayEntityRelease') {
            throw "Monster release cue missing"
          }
