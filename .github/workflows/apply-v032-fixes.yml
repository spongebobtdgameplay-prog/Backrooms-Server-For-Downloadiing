name: Apply V0.3.32 Breaker And Minimap Fixes

on:
  push:
    branches:
      - work/v0.3.32-breaker-minimap

permissions:
  contents: write

jobs:
  apply-and-build:
    if: ${{ !contains(github.event.head_commit.message, '[patch-applied]') }}
    runs-on: windows-2022

    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: work/v0.3.32-breaker-minimap
          fetch-depth: 0

      - name: Apply source fixes
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(path, old, new):
              text = Path(path).read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected exactly one match, found {count}')
              Path(path).write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          def replace_count(path, old, new, expected):
              text = Path(path).read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f'{path}: expected {expected} matches, found {count}')
              Path(path).write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          game_h = 'src/Game/Game.h'
          game_cpp = 'src/Game/Game.cpp'
          map_cpp = 'src/Rendering/MapOverlay.cpp'

          replace_once(
              game_h,
              '    AABB BreakerBounds(const Breaker& BreakerData) const;\n    AABB ExitBounds() const;',
              '    AABB BreakerBounds(const Breaker& BreakerData) const;\n    AABB BreakerInteractionBounds(const Breaker& BreakerData) const;\n    AABB ExitBounds() const;'
          )

          replace_once(
              game_cpp,
              '            Forward * (World.WallThickness * 0.5f + 0.11f) +',
              '            Forward * (World.WallThickness * 0.5f + 0.36f) +'
          )

          old_bounds = '''AABB Game::BreakerBounds(const Breaker& BreakerData) const
          {
              const glm::vec3 Forward = BreakerData.Forward;
              const glm::vec3 Right{
                  Forward.z,
                  0.0f,
                  -Forward.x
              };

              const float HalfX =
                  std::abs(Right.x) * 0.40f +
                  std::abs(Forward.x) * 0.18f;

              const float HalfZ =
                  std::abs(Right.z) * 0.40f +
                  std::abs(Forward.z) * 0.18f;

              return {
                  {
                      BreakerData.Position.x - HalfX,
                      BreakerData.Position.y,
                      BreakerData.Position.z - HalfZ
                  },
                  {
                      BreakerData.Position.x + HalfX,
                      BreakerData.Position.y + 1.05f,
                      BreakerData.Position.z + HalfZ
                  }
              };
          }
          '''
          new_bounds = '''AABB Game::BreakerBounds(const Breaker& BreakerData) const
          {
              const glm::vec3 Forward = BreakerData.Forward;
              const glm::vec3 Right{
                  Forward.z,
                  0.0f,
                  -Forward.x
              };

              const float HalfX =
                  std::abs(Right.x) * 0.35f +
                  std::abs(Forward.x) * 0.36f;

              const float HalfZ =
                  std::abs(Right.z) * 0.35f +
                  std::abs(Forward.z) * 0.36f;

              return {
                  {
                      BreakerData.Position.x - HalfX,
                      BreakerData.Position.y,
                      BreakerData.Position.z - HalfZ
                  },
                  {
                      BreakerData.Position.x + HalfX,
                      BreakerData.Position.y + 0.94f,
                      BreakerData.Position.z + HalfZ
                  }
              };
          }

          AABB Game::BreakerInteractionBounds(const Breaker& BreakerData) const
          {
              const AABB Physical = BreakerBounds(BreakerData);
              const glm::vec3 Expansion{0.12f, 0.12f, 0.12f};

              return {
                  Physical.Min - Expansion,
                  Physical.Max + Expansion
              };
          }
          '''
          replace_once(game_cpp, old_bounds, new_bounds)

          replace_once(
              game_cpp,
              '    const float MaxDistance = 2.5f;',
              '    const float MaxDistance = 2.85f;'
          )

          replace_once(
              game_cpp,
              '            BreakerBounds(Breakers[I]),\n            BestDistance',
              '            BreakerInteractionBounds(Breakers[I]),\n            BestDistance'
          )

          indicator = '''    if (GameRenderer.HasBreakerModel())
          {
              for (const Breaker& BreakerData : Breakers)
              {
                  const glm::vec3 Forward = BreakerData.Forward;
                  const bool FacingX = std::abs(Forward.x) > 0.5f;

                  const glm::vec3 BackingSize = FacingX
                      ? glm::vec3{0.035f, 0.13f, 0.17f}
                      : glm::vec3{0.17f, 0.13f, 0.035f};

                  const glm::vec3 LightSize = FacingX
                      ? glm::vec3{0.028f, 0.078f, 0.078f}
                      : glm::vec3{0.078f, 0.078f, 0.028f};

                  Boxes.push_back({
                      BreakerData.Position -
                          Forward * 0.155f +
                          glm::vec3{0.0f, 0.76f, 0.0f},
                      BackingSize,
                      {0.035f, 0.038f, 0.033f},
                      {0.0f, 0.0f, 0.0f},
                      0.42f,
                      static_cast<int>(SurfaceMaterial::Fixture)
                  });

                  Boxes.push_back({
                      BreakerData.Position -
                          Forward * 0.13f +
                          glm::vec3{0.0f, 0.76f, 0.0f},
                      LightSize,
                      BreakerData.Active
                          ? glm::vec3{0.10f, 0.46f, 0.13f}
                          : glm::vec3{0.50f, 0.07f, 0.045f},
                      BreakerData.Active
                          ? glm::vec3{0.035f, 0.30f, 0.055f}
                          : glm::vec3{0.28f, 0.012f, 0.006f},
                      0.18f,
                      static_cast<int>(SurfaceMaterial::Fixture)
                  });
              }
          }

          '''
          replace_once(
              game_cpp,
              '    if (!GameRenderer.HasExitDoorModel())\n    {',
              indicator + '    if (!GameRenderer.HasExitDoorModel())\n    {'
          )

          old_projection = '''    const float Scale = std::max(PixelsPerMeter, 0.1f);
              const float HalfCell = World.CellSize * 0.5f;

              auto ToScreen = [&](float WorldX, float WorldZ)
              {
                  return glm::ivec2{
                      X + PanelWidth / 2 +
                          static_cast<int>(std::round((WorldX - MapCenter.x) * Scale)),
                      Y + PanelHeight / 2 +
                          static_cast<int>(std::round((WorldZ - MapCenter.y) * Scale))
                  };
              };
          '''
          new_projection = '''    const float Scale = std::max(PixelsPerMeter, 0.1f);
              const float HalfCell = World.CellSize * 0.5f;

              glm::vec2 MapForward = PlayerForward;
              if (glm::length(MapForward) < 0.001f)
                  MapForward = {0.0f, -1.0f};
              else
                  MapForward = glm::normalize(MapForward);

              const glm::vec2 MapRight{-MapForward.y, MapForward.x};

              auto ToScreen = [&](float WorldX, float WorldZ)
              {
                  const glm::vec2 Delta{
                      WorldX - MapCenter.x,
                      WorldZ - MapCenter.y
                  };

                  if (!Detailed)
                  {
                      return glm::ivec2{
                          X + PanelWidth / 2 +
                              static_cast<int>(std::round(glm::dot(Delta, MapRight) * Scale)),
                          Y + PanelHeight / 2 -
                              static_cast<int>(std::round(glm::dot(Delta, MapForward) * Scale))
                      };
                  }

                  return glm::ivec2{
                      X + PanelWidth / 2 +
                          static_cast<int>(std::round(Delta.x * Scale)),
                      Y + PanelHeight / 2 +
                          static_cast<int>(std::round(Delta.y * Scale))
                  };
              };
          '''
          replace_once(map_cpp, old_projection, new_projection)

          old_walls = '''    const int WallThickness = Detailed ? 1 : 2;

              for (int LocalZ = 0; LocalZ < World.Rows; ++LocalZ)
              {
                  for (int LocalX = 0; LocalX < World.Columns; ++LocalX)
                  {
                      const MazeCell& Cell = World.Cell(LocalX, LocalZ);
                      const float CenterX = static_cast<float>(Cell.X) * World.CellSize;
                      const float CenterZ = static_cast<float>(Cell.Z) * World.CellSize;
                      const glm::ivec2 TopLeft = ToScreen(CenterX - HalfCell, CenterZ - HalfCell);
                      const glm::ivec2 BottomRight = ToScreen(CenterX + HalfCell, CenterZ + HalfCell);

                      if (
                          BottomRight.x < X ||
                          BottomRight.y < Y ||
                          TopLeft.x > X + PanelWidth ||
                          TopLeft.y > Y + PanelHeight
                      )
                      {
                          continue;
                      }

                      const int CellWidth = std::max(BottomRight.x - TopLeft.x, 1);
                      const int CellHeight = std::max(BottomRight.y - TopLeft.y, 1);

                      if (Cell.Walls[0])
                          ClipRect(TopLeft.x, TopLeft.y, CellWidth, WallThickness, Wall);
                      if (Cell.Walls[1])
                          ClipRect(BottomRight.x - WallThickness, TopLeft.y, WallThickness, CellHeight, Wall);
                      if (Cell.Walls[2])
                          ClipRect(TopLeft.x, BottomRight.y - WallThickness, CellWidth, WallThickness, Wall);
                      if (Cell.Walls[3])
                          ClipRect(TopLeft.x, TopLeft.y, WallThickness, CellHeight, Wall);
                  }
              }
          '''
          new_walls = '''    const int WallThickness = Detailed ? 1 : 2;

              for (int LocalZ = 0; LocalZ < World.Rows; ++LocalZ)
              {
                  for (int LocalX = 0; LocalX < World.Columns; ++LocalX)
                  {
                      const MazeCell& Cell = World.Cell(LocalX, LocalZ);
                      const float CenterX = static_cast<float>(Cell.X) * World.CellSize;
                      const float CenterZ = static_cast<float>(Cell.Z) * World.CellSize;

                      if (!Detailed)
                      {
                          const glm::ivec2 NorthWest = ToScreen(CenterX - HalfCell, CenterZ - HalfCell);
                          const glm::ivec2 NorthEast = ToScreen(CenterX + HalfCell, CenterZ - HalfCell);
                          const glm::ivec2 SouthEast = ToScreen(CenterX + HalfCell, CenterZ + HalfCell);
                          const glm::ivec2 SouthWest = ToScreen(CenterX - HalfCell, CenterZ + HalfCell);

                          const int MinimumX = std::min({NorthWest.x, NorthEast.x, SouthEast.x, SouthWest.x});
                          const int MaximumX = std::max({NorthWest.x, NorthEast.x, SouthEast.x, SouthWest.x});
                          const int MinimumY = std::min({NorthWest.y, NorthEast.y, SouthEast.y, SouthWest.y});
                          const int MaximumY = std::max({NorthWest.y, NorthEast.y, SouthEast.y, SouthWest.y});

                          if (
                              MaximumX < X ||
                              MaximumY < Y ||
                              MinimumX > X + PanelWidth ||
                              MinimumY > Y + PanelHeight
                          )
                          {
                              continue;
                          }

                          if (Cell.Walls[0])
                              Line(NorthWest, NorthEast, WallThickness, Wall);
                          if (Cell.Walls[1])
                              Line(NorthEast, SouthEast, WallThickness, Wall);
                          if (Cell.Walls[2])
                              Line(SouthWest, SouthEast, WallThickness, Wall);
                          if (Cell.Walls[3])
                              Line(NorthWest, SouthWest, WallThickness, Wall);

                          continue;
                      }

                      const glm::ivec2 TopLeft = ToScreen(CenterX - HalfCell, CenterZ - HalfCell);
                      const glm::ivec2 BottomRight = ToScreen(CenterX + HalfCell, CenterZ + HalfCell);

                      if (
                          BottomRight.x < X ||
                          BottomRight.y < Y ||
                          TopLeft.x > X + PanelWidth ||
                          TopLeft.y > Y + PanelHeight
                      )
                      {
                          continue;
                      }

                      const int CellWidth = std::max(BottomRight.x - TopLeft.x, 1);
                      const int CellHeight = std::max(BottomRight.y - TopLeft.y, 1);

                      if (Cell.Walls[0])
                          ClipRect(TopLeft.x, TopLeft.y, CellWidth, WallThickness, Wall);
                      if (Cell.Walls[1])
                          ClipRect(BottomRight.x - WallThickness, TopLeft.y, WallThickness, CellHeight, Wall);
                      if (Cell.Walls[2])
                          ClipRect(TopLeft.x, BottomRight.y - WallThickness, CellWidth, WallThickness, Wall);
                      if (Cell.Walls[3])
                          ClipRect(TopLeft.x, TopLeft.y, WallThickness, CellHeight, Wall);
                  }
              }
          '''
          replace_once(map_cpp, old_walls, new_walls)

          replace_once(map_cpp, '        const int MarkerSafeInset = Detailed ? 0 : 16;', '        const int MarkerSafeInset = Detailed ? 0 : 10;')
          replace_count(map_cpp, '            const int Radius = Detailed ? 8 : 8;', '            const int Radius = Detailed ? 8 : 4;', 2)
          replace_once(map_cpp, '            const int Radius = Detailed ? 9 : 9;', '            const int Radius = Detailed ? 9 : 5;')

          old_breaker_icon = '''            Line(
                          {Position.x - 4, Position.y + 4},
                          {Position.x + 3, Position.y - 3},
                          2,
                          Ink
                      );
                      FillCircle(Position.x + 4, Position.y - 4, 2, Ink);
                      ClipRect(Position.x - 6, Position.y + 3, 5, 3, Ink);
          '''
          new_breaker_icon = '''            const int IconReach = Detailed ? 4 : 2;
                      Line(
                          {Position.x - IconReach, Position.y + IconReach},
                          {Position.x + IconReach, Position.y - IconReach},
                          Detailed ? 2 : 1,
                          Ink
                      );
                      FillCircle(
                          Position.x + IconReach,
                          Position.y - IconReach,
                          Detailed ? 2 : 1,
                          Ink
                      );
                      ClipRect(
                          Position.x - (Detailed ? 6 : 3),
                          Position.y + (Detailed ? 3 : 2),
                          Detailed ? 5 : 3,
                          Detailed ? 3 : 2,
                          Ink
                      );
          '''
          replace_once(map_cpp, old_breaker_icon, new_breaker_icon)

          old_waypoint = '        const int Pulse = 9 + static_cast<int>((std::sin(Time * 5.0f) + 1.0f) * 2.0f);'
          new_waypoint = '''        const int Pulse = Detailed
                      ? 9 + static_cast<int>((std::sin(Time * 5.0f) + 1.0f) * 2.0f)
                      : 5 + static_cast<int>((std::sin(Time * 5.0f) + 1.0f) * 1.0f);'''
          replace_once(map_cpp, old_waypoint, new_waypoint)

          old_player = '''    const glm::ivec2 PlayerScreen = ToScreen(PlayerPosition.x, PlayerPosition.y);
              glm::vec2 Direction = PlayerForward;

              if (glm::length(Direction) < 0.001f)
                  Direction = {0.0f, -1.0f};
              else
                  Direction = glm::normalize(Direction);

              const glm::vec2 Right{Direction.y, -Direction.x};
              const int ArrowLength = Detailed ? 14 : 16;
              const int ArrowWidth = Detailed ? 8 : 9;
              const glm::ivec2 Tip{
                  PlayerScreen.x + static_cast<int>(std::round(Direction.x * ArrowLength)),
                  PlayerScreen.y + static_cast<int>(std::round(Direction.y * ArrowLength))
              };
              const glm::ivec2 Left{
                  PlayerScreen.x - static_cast<int>(std::round(Direction.x * 5.0f)) + static_cast<int>(std::round(Right.x * ArrowWidth)),
                  PlayerScreen.y - static_cast<int>(std::round(Direction.y * 5.0f)) + static_cast<int>(std::round(Right.y * ArrowWidth))
              };
              const glm::ivec2 RightPoint{
                  PlayerScreen.x - static_cast<int>(std::round(Direction.x * 5.0f)) - static_cast<int>(std::round(Right.x * ArrowWidth)),
                  PlayerScreen.y - static_cast<int>(std::round(Direction.y * 5.0f)) - static_cast<int>(std::round(Right.y * ArrowWidth))
              };
          '''
          new_player = '''    const glm::ivec2 PlayerScreen = ToScreen(PlayerPosition.x, PlayerPosition.y);
              glm::vec2 Direction = Detailed ? PlayerForward : glm::vec2{0.0f, -1.0f};

              if (glm::length(Direction) < 0.001f)
                  Direction = {0.0f, -1.0f};
              else
                  Direction = glm::normalize(Direction);

              const glm::vec2 Right{-Direction.y, Direction.x};
              const int ArrowLength = Detailed ? 14 : 9;
              const int ArrowWidth = Detailed ? 8 : 5;
              const float TailLength = Detailed ? 5.0f : 3.0f;
              const glm::ivec2 Tip{
                  PlayerScreen.x + static_cast<int>(std::round(Direction.x * ArrowLength)),
                  PlayerScreen.y + static_cast<int>(std::round(Direction.y * ArrowLength))
              };
              const glm::ivec2 Left{
                  PlayerScreen.x - static_cast<int>(std::round(Direction.x * TailLength)) + static_cast<int>(std::round(Right.x * ArrowWidth)),
                  PlayerScreen.y - static_cast<int>(std::round(Direction.y * TailLength)) + static_cast<int>(std::round(Right.y * ArrowWidth))
              };
              const glm::ivec2 RightPoint{
                  PlayerScreen.x - static_cast<int>(std::round(Direction.x * TailLength)) - static_cast<int>(std::round(Right.x * ArrowWidth)),
                  PlayerScreen.y - static_cast<int>(std::round(Direction.y * TailLength)) - static_cast<int>(std::round(Right.y * ArrowWidth))
              };
          '''
          replace_once(map_cpp, old_player, new_player)
          replace_once(map_cpp, '    FillCircle(PlayerScreen.x, PlayerScreen.y, 3, RouteColor);', '    FillCircle(PlayerScreen.x, PlayerScreen.y, Detailed ? 3 : 2, RouteColor);')

          for path in ['CMakeLists.txt', 'src/Core/Version.h']:
              replace_count(path, '0.3.31', '0.3.32', Path(path).read_text(encoding='utf-8').count('0.3.31'))

          rc = 'src/Platform/Windows/Backrooms.rc'
          rc_text = Path(rc).read_text(encoding='utf-8')
          if '0,3,31,0' not in rc_text or '0.3.31' not in rc_text:
              raise RuntimeError('Backrooms.rc version markers were not found')
          rc_text = rc_text.replace('0,3,31,0', '0,3,32,0').replace('0.3.31', '0.3.32')
          Path(rc).write_text(rc_text, encoding='utf-8', newline='\n')

          Path('update/release_notes.txt').write_text(
              'V0.3.32 fixes the gameplay minimap and wall-mounted breakers. The gameplay minimap now rotates around the player so the current camera direction always stays at the top while the full map remains world-fixed. Minimap breaker, exit, entity, waypoint, and player markers are reduced so they no longer cover the maze. Breakers are mounted farther out from the wall to account for the open cabinet model, use collision dimensions that match the visible model more closely, accept a slightly wider aiming target and longer interaction distance, and show a visible red indicator before activation and green indicator after activation.\n',
              encoding='utf-8',
              newline='\n'
          )
          '@ | Set-Content apply_v032.py
          python apply_v032.py
          Remove-Item apply_v032.py

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "build\Release\Backrooms Offical.exe")) {
            throw "Backrooms Offical.exe was not produced"
          }

      - name: Commit tested fixes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt src/Game/Game.h src/Game/Game.cpp src/Rendering/MapOverlay.cpp src/Core/Version.h src/Platform/Windows/Backrooms.rc update/release_notes.txt
          git commit -m "Fix V0.3.32 breaker interaction and rotating minimap [patch-applied]"
          git push origin HEAD:work/v0.3.32-breaker-minimap
