name: Apply V0.3.10 Input And Presentation Fixes

on:
  push:
    branches:
      - work/v0.3.10-fix
    paths:
      - tools/apply_v0310.py

permissions:
  contents: write

jobs:
  patch-build-promote:
    runs-on: windows-2022
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: work/v0.3.10-fix
          fetch-depth: 0

      - name: Apply V0.3.10 patch
        shell: pwsh
        run: python tools/apply_v0310.py

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "build\Release\Backrooms Offical.exe")) {
            throw "Backrooms Offical.exe was not produced"
          }
          if (!(Test-Path "build\Release\SDL3.dll")) {
            throw "SDL3.dll was not packaged"
          }

      - name: Promote one clean commit to main
        shell: pwsh
        run: |
          git fetch origin main
          $Expected = "513b37398d7683d96258c8290eff37cd61bbdadb"
          $Actual = (git rev-parse origin/main).Trim()
          if ($Actual -ne $Expected) {
            throw "main moved while V0.3.10 was being prepared: $Actual"
          }

          Remove-Item "tools\apply_v0310.py" -Force
          Remove-Item ".github\workflows\apply-v0310-fix.yml" -Force

          git reset --soft origin/main
          git add -A
          git config user.name "spongebobtdgameplay-prog"
          git config user.email "spongebobtdgameplay@gmail.com"
          git commit -m "Fix touchpad look, console launch, UI text, and restored motion in V0.3.10"
          git push origin HEAD:main
