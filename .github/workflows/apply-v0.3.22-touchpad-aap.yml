name: Apply V0.3.22 Touchpad Input Fix

on:
  push:
    branches:
      - fix-v0.3.22-touchpad-aap

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source fix
        shell: pwsh
        run: |
          $Path = "src\Core\Application.cpp"
          $Text = Get-Content $Path -Raw
          $Pattern = '(?s)#ifdef _WIN32\r?\n#if defined\(SPI_GETTOUCHPADPARAMETERS\).*?#endif\r?\n#else\r?\n    void SetGameplayTouchpadMode\(bool Enabled\)\r?\n    \{\r?\n        static_cast<void>\(Enabled\);\r?\n    \}\r?\n#endif'
          $Replacement = @'
          #ifdef _WIN32
              constexpr wchar_t TouchpadRegistryPath[] =
                  L"Software\\Microsoft\\Windows\\CurrentVersion\\PrecisionTouchPad";

              constexpr wchar_t TouchpadAapValue[] =
                  L"AAPThreshold";

              struct TouchpadOverrideState
              {
                  bool Active = false;
                  bool RegistryActive = false;
                  bool HadAapThreshold = false;
                  DWORD SavedAapThreshold = 0;

          #if defined(SPI_GETTOUCHPADPARAMETERS) && \
              defined(SPI_SETTOUCHPADPARAMETERS) && \
              defined(TOUCHPAD_PARAMETERS_VERSION_1)
                  bool ApiActive = false;
                  TOUCHPAD_PARAMETERS_V1 SavedTouchpadParameters{};
          #endif
              };

              TouchpadOverrideState TouchpadOverride{};

              void NotifyTouchpadSettingChanged()
              {
                  DWORD_PTR Ignored = 0;

                  SendMessageTimeoutW(
                      HWND_BROADCAST,
                      WM_SETTINGCHANGE,
                      0,
                      reinterpret_cast<LPARAM>(TouchpadRegistryPath),
                      SMTO_ABORTIFHUNG,
                      150,
                      &Ignored
                  );
              }

              bool EnablePrecisionTouchpadAapOverride()
              {
                  HKEY Key = nullptr;

                  if (
                      RegOpenKeyExW(
                          HKEY_CURRENT_USER,
                          TouchpadRegistryPath,
                          0,
                          KEY_QUERY_VALUE | KEY_SET_VALUE,
                          &Key
                      ) != ERROR_SUCCESS)
                  {
                      return false;
                  }

                  DWORD PreviousValue = 0;
                  DWORD PreviousType = 0;
                  DWORD PreviousSize = sizeof(PreviousValue);

                  const LONG QueryResult =
                      RegQueryValueExW(
                          Key,
                          TouchpadAapValue,
                          nullptr,
                          &PreviousType,
                          reinterpret_cast<BYTE*>(&PreviousValue),
                          &PreviousSize
                      );

                  if (QueryResult == ERROR_SUCCESS)
                  {
                      if (PreviousType != REG_DWORD)
                      {
                          RegCloseKey(Key);
                          return false;
                      }

                      TouchpadOverride.HadAapThreshold = true;
                      TouchpadOverride.SavedAapThreshold = PreviousValue;
                  }
                  else if (QueryResult == ERROR_FILE_NOT_FOUND)
                  {
                      TouchpadOverride.HadAapThreshold = false;
                      TouchpadOverride.SavedAapThreshold = 0;
                  }
                  else
                  {
                      RegCloseKey(Key);
                      return false;
                  }

                  const DWORD MaximumSensitivity = 0;

                  const LONG SetResult =
                      RegSetValueExW(
                          Key,
                          TouchpadAapValue,
                          0,
                          REG_DWORD,
                          reinterpret_cast<const BYTE*>(&MaximumSensitivity),
                          sizeof(MaximumSensitivity)
                      );

                  RegCloseKey(Key);

                  if (SetResult != ERROR_SUCCESS)
                      return false;

                  TouchpadOverride.RegistryActive = true;
                  NotifyTouchpadSettingChanged();
                  return true;
              }

              void RestorePrecisionTouchpadAapOverride()
              {
                  if (!TouchpadOverride.RegistryActive)
                      return;

                  HKEY Key = nullptr;

                  if (
                      RegOpenKeyExW(
                          HKEY_CURRENT_USER,
                          TouchpadRegistryPath,
                          0,
                          KEY_SET_VALUE,
                          &Key
                      ) == ERROR_SUCCESS)
                  {
                      if (TouchpadOverride.HadAapThreshold)
                      {
                          RegSetValueExW(
                              Key,
                              TouchpadAapValue,
                              0,
                              REG_DWORD,
                              reinterpret_cast<const BYTE*>(
                                  &TouchpadOverride.SavedAapThreshold
                              ),
                              sizeof(TouchpadOverride.SavedAapThreshold)
                          );
                      }
                      else
                      {
                          RegDeleteValueW(
                              Key,
                              TouchpadAapValue
                          );
                      }

                      RegCloseKey(Key);
                      NotifyTouchpadSettingChanged();
                  }

                  TouchpadOverride.RegistryActive = false;
              }

              void SetGameplayTouchpadMode(bool Enabled)
              {
                  if (Enabled)
                  {
                      if (TouchpadOverride.Active)
                          return;

                      bool Changed =
                          EnablePrecisionTouchpadAapOverride();

          #if defined(SPI_GETTOUCHPADPARAMETERS) && \
              defined(SPI_SETTOUCHPADPARAMETERS) && \
              defined(TOUCHPAD_PARAMETERS_VERSION_1)
                      TOUCHPAD_PARAMETERS_V1 Current{};
                      Current.versionNumber =
                          TOUCHPAD_PARAMETERS_VERSION_1;

                      if (
                          SystemParametersInfoW(
                              SPI_GETTOUCHPADPARAMETERS,
                              static_cast<UINT>(sizeof(Current)),
                              &Current,
                              0
                          ) &&
                          Current.touchpadPresent)
                      {
                          TouchpadOverride.SavedTouchpadParameters = Current;
                          Current.sensitivityLevel =
                              TOUCHPAD_SENSITIVITY_LEVEL_MOST_SENSITIVE;

                          if (
                              SystemParametersInfoW(
                                  SPI_SETTOUCHPADPARAMETERS,
                                  static_cast<UINT>(sizeof(Current)),
                                  &Current,
                                  SPIF_SENDCHANGE
                              ))
                          {
                              TouchpadOverride.ApiActive = true;
                              Changed = true;
                          }
                      }
          #endif

                      TouchpadOverride.Active = Changed;
                      return;
                  }

                  RestorePrecisionTouchpadAapOverride();

          #if defined(SPI_GETTOUCHPADPARAMETERS) && \
              defined(SPI_SETTOUCHPADPARAMETERS) && \
              defined(TOUCHPAD_PARAMETERS_VERSION_1)
                  if (TouchpadOverride.ApiActive)
                  {
                      SystemParametersInfoW(
                          SPI_SETTOUCHPADPARAMETERS,
                          static_cast<UINT>(
                              sizeof(TouchpadOverride.SavedTouchpadParameters)
                          ),
                          &TouchpadOverride.SavedTouchpadParameters,
                          SPIF_SENDCHANGE
                      );
                  }
          #endif

                  TouchpadOverride = {};
              }
          #else
              void SetGameplayTouchpadMode(bool Enabled)
              {
                  static_cast<void>(Enabled);
              }
          #endif
          '@
          $Replacement = ($Replacement -split "`r?`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`n"
          $Updated = [regex]::Replace($Text, $Pattern, $Replacement, 1)
          if ($Updated -eq $Text) { throw "Could not replace the old touchpad override block" }
          Set-Content $Path $Updated -NoNewline

          $CMake = Get-Content "CMakeLists.txt" -Raw
          $CMake = $CMake.Replace('project(BackroomsOffical VERSION 0.3.21 LANGUAGES C CXX)', 'project(BackroomsOffical VERSION 0.3.22 LANGUAGES C CXX)')
          $CMake = $CMake.Replace("        gdi32`n", "        gdi32`n        advapi32`n        user32`n")
          Set-Content "CMakeLists.txt" $CMake -NoNewline

          $Version = Get-Content "src\Core\Version.h" -Raw
          $Version = $Version.Replace('Text = "0.3.21"', 'Text = "0.3.22"')
          Set-Content "src\Core\Version.h" $Version -NoNewline

          $Rc = Get-Content "src\Platform\Windows\Backrooms.rc" -Raw
          $Rc = $Rc.Replace('0,3,21,0', '0,3,22,0').Replace('0.3.21', '0.3.22')
          Set-Content "src\Platform\Windows\Backrooms.rc" $Rc -NoNewline

          Set-Content "update\release_notes.txt" 'V0.3.22 fixes the laptop touchpad camera freeze while keyboard movement keys such as W are held. The Windows build now temporarily disables Precision Touchpad Accidental Activation Prevention by setting the current user AAPThreshold to maximum sensitivity only while gameplay mouse capture is active, while keeping SDL GameInput enabled. The exact previous AAPThreshold is restored when mouse capture ends or the game closes. On Windows SDKs that expose the touchpad SystemParametersInfo API, the game also applies and restores the documented most-sensitive touchpad mode. No administrator permission is required and no global keyboard hook or background key capture is used.'

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "build\Release\Backrooms Offical.exe")) {
            throw "Backrooms Offical.exe was not produced"
          }

      - name: Commit tested fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt src/Core/Application.cpp src/Core/Version.h src/Platform/Windows/Backrooms.rc update/release_notes.txt
          git commit -m "Apply V0.3.22 touchpad input fix"
          git push origin HEAD:fix-v0.3.22-touchpad-aap
