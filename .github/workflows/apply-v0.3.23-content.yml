name: Apply V0.3.23 Content Pass

on:
  push:
    branches:
      - feature-v0.3.23-breaker-entity-audio

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V0.3.23 source changes
        shell: pwsh
        run: python .github/apply_v0323.py

      - name: Verify vendored content
        shell: pwsh
        run: |
          $Required = @(
            "assets/models/power_box_01/power_box_01_1k.gltf",
            "assets/models/power_box_01/power_box_01.bin",
            "assets/audio/fluorescent-hum.ogg",
            "assets/audio/breaker-trip.ogg",
            "assets/audio/footstep-carpet-1.ogg",
            "assets/audio/footstep-carpet-2.ogg",
            "assets/audio/footstep-carpet-3.ogg",
            "assets/audio/footstep-carpet-4.ogg",
            "assets/audio/entity-metal.ogg"
          )
          foreach ($Path in $Required) {
            if (!(Test-Path $Path)) { throw "Missing required content asset: $Path" }
          }

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Verify executable and packaged assets
        shell: pwsh
        run: |
          if (!(Test-Path "build/Release/Backrooms Offical.exe")) {
            throw "Backrooms Offical.exe was not produced"
          }
          if (!(Test-Path "build/Release/assets/models/power_box_01/power_box_01_1k.gltf")) {
            throw "Breaker model was not copied beside the executable"
          }
          if (!(Test-Path "build/Release/assets/audio/fluorescent-hum.ogg")) {
            throw "Recorded ambience was not copied beside the executable"
          }

      - name: Commit tested V0.3.23 source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/apply_v0323.py .github/workflows/apply-v0.3.23-content.yml .github/workflows/vendor-v0.3.23-assets.yml
          git add CMakeLists.txt THIRD_PARTY_ASSETS.md src update/release_notes.txt
          git commit -m "Implement V0.3.23 breaker entity and audio pass [skip ci]"
          git push origin HEAD:feature-v0.3.23-breaker-entity-audio
