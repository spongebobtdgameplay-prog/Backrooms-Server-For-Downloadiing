name: V0.3.26 Infinite Map Gate

on:
  push:
    branches:
      - feature-v0.3.26-infinite-map-menu
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v0326-infinite-map-gate
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature-v0.3.26-infinite-map-menu
          fetch-depth: 0

      - name: Apply V0.3.26 map pass
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_v0326_map.py
          grep -q '0.3.26' src/Core/Version.h
          grep -q 'DrawMiniMapV1' src/Rendering/MapOverlay.cpp
          grep -q 'BuildMapAround' src/World/WorldGenerator.cpp
          grep -q 'OpenMap(false)' src/Game/Game.cpp
          grep -q 'MenuUiAction::Map' src/Rendering/InteractiveMenu.cpp

      - name: Commit prepared V0.3.26 source
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply_v0326_map.py .github/workflows/v0326-map-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement V0.3.26 infinite GTA-style map and menu [skip ci]"
          git push origin HEAD:feature-v0.3.26-infinite-map-menu

  build-windows:
    needs: prepare
    runs-on: windows-2022
    steps:
      - name: Checkout prepared feature branch
        uses: actions/checkout@v4
        with:
          ref: feature-v0.3.26-infinite-map-menu
          fetch-depth: 1

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Verify V0.3.26 executable and map source
        shell: pwsh
        run: |
          if (!(Test-Path "build\Release\Backrooms Offical.exe")) {
            throw "Backrooms Offical.exe was not produced"
          }
          if ((Get-Content "src\Core\Version.h" -Raw) -notmatch '0\.3\.26') {
            throw "Version.h is not V0.3.26"
          }
          if ((Get-Content "CMakeLists.txt" -Raw) -notmatch 'VERSION 0\.3\.26') {
            throw "CMake project version is not V0.3.26"
          }
          if (!(Test-Path "src\Rendering\MapOverlay.cpp")) {
            throw "MapOverlay.cpp missing"
          }
          $Map = Get-Content "src\Rendering\MapOverlay.cpp" -Raw
          if ($Map -notmatch 'DrawMiniMapV1' -or $Map -notmatch 'DrawFullMapV1') {
            throw "Map render functions missing"
          }
          $Game = Get-Content "src\Game\Game.cpp" -Raw
          if ($Game -notmatch 'SDL_EVENT_MOUSE_WHEEL' -or $Game -notmatch 'OpenMap\(false\)') {
            throw "Infinite map input wiring missing"
          }
          $World = Get-Content "src\World\WorldGenerator.cpp" -Raw
          if ($World -notmatch 'BuildMapAround') {
            throw "Map-only deterministic chunk generation missing"
          }
