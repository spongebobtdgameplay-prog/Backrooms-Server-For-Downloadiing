name: V0.3.29 HUD Reticle Gate Rerun

on:
  push:
    branches:
      - feature-v0.3.29-hud-reticle
    paths:
      - tools/v0329_hud_reticle_patch_runner.py
      - .github/workflows/v0329-hud-reticle-gate-rerun.yml

permissions:
  contents: write

jobs:
  build-test:
    runs-on: windows-2022
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply corrected V0.3.29 HUD patch
        shell: pwsh
        run: python tools/v0329_hud_reticle_patch_runner.py

      - name: Verify HUD source changes
        shell: pwsh
        run: |
          $Renderer = Get-Content "src\Rendering\Renderer.cpp" -Raw
          $TextRenderer = Get-Content "src\Rendering\GameTextRenderer.cpp" -Raw
          $Overlay = Get-Content "src\Rendering\InteractiveMenu.cpp" -Raw
          $Version = Get-Content "src\Core\Version.h" -Raw
          if ($Renderer -match 'glScissor\(CenterX, CenterY - 5, 1, 10\)') { throw "Old plus crosshair remains" }
          if ($Renderer -notmatch 'DrawRect\(CenterX - 12, CenterY - 2, 7, 3, Stroke\)') { throw "New separated reticle missing" }
          if ($TextRenderer -notmatch 'StrokeRadius') { throw "HUD outline pass missing" }
          if ($TextRenderer -notmatch 'Opacity \* 0\.92f') { throw "HUD stroke opacity missing" }
          if ($Version -notmatch '0\.3\.29') { throw "Version was not bumped" }

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "build\Release\Backrooms Offical.exe")) {
            throw "Backrooms Offical.exe was not produced"
          }

      - name: Commit tested V0.3.29 files
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt src/Core/Version.h src/Platform/Windows/Backrooms.rc src/Rendering/Renderer.cpp src/Rendering/GameTextRenderer.cpp src/Rendering/InteractiveMenu.cpp update/release_notes.txt
          git commit -m "Apply tested V0.3.29 HUD strokes and reticle [skip ci]"
          git push origin HEAD:feature-v0.3.29-hud-reticle
