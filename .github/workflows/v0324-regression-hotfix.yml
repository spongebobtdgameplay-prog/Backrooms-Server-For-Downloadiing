name: V0.3.24 Regression Hotfix

on:
  push:
    branches:
      - fix-v0.3.24-audio-exit-breakers
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix-v0.3.24-audio-exit-breakers
          fetch-depth: 0

      - name: Convert recorded audio to PCM WAV
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          shopt -s nullglob
          files=(assets/audio/*.ogg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No OGG files found to convert"
            exit 1
          fi
          for file in "${files[@]}"; do
            out="${file%.ogg}.wav"
            ffmpeg -v error -y -i "$file" -ac 1 -ar 44100 -c:a pcm_s16le "$out"
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of default=nw=1 "$out"
          done
          rm assets/audio/*.ogg

      - name: Apply V0.3.24 source fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def load(path):
              return Path(path).read_text(encoding='utf-8')

          def save(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          app_path = 'src/Core/Application.cpp'
          app = load(app_path)
          app = replace_once(
              app,
              '''bool Application::Initialize()\n{\n    if (!InitializeWindow())\n        return false;\n\n    if (!InitializeOpenGL())''',
              '''bool Application::Initialize()\n{\n    if (!InitializeWindow())\n        return false;\n\n    std::error_code WorkingDirectoryError;\n    std::filesystem::current_path(\n        ExecutableDirectory(),\n        WorkingDirectoryError\n    );\n\n    if (WorkingDirectoryError)\n    {\n        SDL_Log(\n            "Could not set working directory to executable folder: %s",\n            WorkingDirectoryError.message().c_str()\n        );\n    }\n\n    if (!InitializeOpenGL())''',
              'executable-relative asset root'
          )
          save(app_path, app)

          audio_path = 'src/Audio/AudioSystem.cpp'
          audio = load(audio_path).replace('.ogg', '.wav')
          replacements = [
              ('"assets/audio/fluorescent-hum.wav",\n        true,\n        false,\n        0.16f', '"assets/audio/fluorescent-hum.wav",\n        true,\n        false,\n        0.24f'),
              ('"assets/audio/hum.wav",\n            true,\n            false,\n            0.10f', '"assets/audio/hum.wav",\n            true,\n            false,\n            0.18f'),
              ('"assets/audio/breaker-trip.wav",\n        false,\n        true,\n        0.38f', '"assets/audio/breaker-trip.wav",\n        false,\n        true,\n        0.65f'),
              ('"assets/audio/entity-metal.wav",\n        false,\n        true,\n        0.11f', '"assets/audio/entity-metal.wav",\n        false,\n        true,\n        0.25f'),
              ('"assets/audio/shift.wav",\n        false,\n        true,\n        0.18f', '"assets/audio/shift.wav",\n        false,\n        true,\n        0.28f'),
              ('"assets/audio/entity-laugh.wav",\n        false,\n        true,\n        0.16f', '"assets/audio/entity-laugh.wav",\n        false,\n        true,\n        0.24f'),
              ('Path.c_str(),\n            false,\n            true,\n            0.14f', 'Path.c_str(),\n            false,\n            true,\n            0.32f'),
              ('0.145f + Threat * 0.025f', '0.22f + Threat * 0.04f'),
              ('0.045f + Threat * 0.16f', '0.12f + Threat * 0.24f'),
              ('0.42f,\n        0.93f', '0.70f,\n        0.93f'),
              ('0.13f,\n        Pitch', '0.32f,\n        Pitch'),
              ('0.19f,\n        DemonForm ? 0.88f : 1.04f', '0.30f,\n        DemonForm ? 0.88f : 1.04f'),
              ('0.13f,\n            0.90f', '0.22f,\n            0.90f')
          ]
          for old, new in replacements:
              if old not in audio:
                  raise RuntimeError(f'audio replacement missing: {old[:60]!r}')
              audio = audio.replace(old, new, 1)
          save(audio_path, audio)

          header_path = 'src/Game/Game.h'
          header = load(header_path)
          header = replace_once(
              header,
              '    glm::vec3 ExitPosition{0.0f};\n',
              '    glm::vec3 ExitPosition{0.0f};\n    glm::vec3 ExitForward{0.0f, 0.0f, 1.0f};\n',
              'exit facing member'
          )
          save(header_path, header)

          game_path = 'src/Game/Game.cpp'
          game = load(game_path)
          game = replace_once(
              game,
              '''    ExitPosition = Pick(38.0f);\n\n    const glm::vec3 EntityPosition = Pick(50.0f);''',
              '''    Breaker MountedExit;\n    bool ExitMounted = false;\n\n    for (int Attempt = 0; Attempt < 48; ++Attempt)\n    {\n        const glm::vec3 Candidate = Pick(38.0f);\n\n        if (TryMountBreaker(\n                Candidate,\n                900 + Attempt,\n                MountedExit\n            ))\n        {\n            ExitMounted = true;\n            break;\n        }\n    }\n\n    if (ExitMounted)\n    {\n        ExitPosition = MountedExit.Position;\n        ExitPosition.y = 0.0f;\n        ExitForward = MountedExit.Forward;\n    }\n    else\n    {\n        ExitPosition = Pick(38.0f);\n        ExitPosition.y = 0.0f;\n        ExitForward = {0.0f, 0.0f, 1.0f};\n    }\n\n    const glm::vec3 EntityPosition = Pick(50.0f);''',
              'wall-mounted exit placement'
          )

          exit_bounds_pattern = re.compile(
              r'''AABB Game::ExitBounds\(\) const\n\{\n.*?\n\}\n\nvoid Game::UpdateInteraction\(\)''',
              re.S
          )
          exit_bounds_replacement = '''AABB Game::ExitBounds() const\n{\n    const bool FacingX =\n        std::abs(ExitForward.x) > 0.5f;\n\n    const glm::vec3 Center =\n        ExitPosition + glm::vec3{0.0f, 1.27f, 0.0f};\n\n    const glm::vec3 HalfExtents =\n        FacingX\n            ? glm::vec3{0.20f, 1.27f, 0.74f}\n            : glm::vec3{0.74f, 1.27f, 0.20f};\n\n    return {\n        Center - HalfExtents,\n        Center + HalfExtents\n    };\n}\n\nvoid Game::UpdateInteraction()'''
          game, count = exit_bounds_pattern.subn(exit_bounds_replacement, game, count=1)
          if count != 1:
              raise RuntimeError(f'exit bounds replacement count {count}')

          dynamic_pattern = re.compile(
              r'''    if \(!GameRenderer\.HasBreakerModel\(\)\)\n    \{.*?\n    \}\n\n    Boxes\.push_back\(\{\n        ExitPosition.*?\n    \}\);\n\n    if \(!GameRenderer\.HasEntityModels\(\)\)''',
              re.S
          )
          dynamic_replacement = '''    if (!GameRenderer.HasBreakerModel())\n    {\n        for (const Breaker& BreakerData : Breakers)\n        {\n            const glm::vec3 Forward = BreakerData.Forward;\n            const glm::vec3 Right{\n                Forward.z,\n                0.0f,\n                -Forward.x\n            };\n\n            const bool FacingX =\n                std::abs(Forward.x) > 0.5f;\n\n            auto OrientedSize = [&](\n                float Width,\n                float Height,\n                float Depth\n            )\n            {\n                return FacingX\n                    ? glm::vec3{Depth, Height, Width}\n                    : glm::vec3{Width, Height, Depth};\n            };\n\n            auto AddPiece = [&](\n                const glm::vec3& Position,\n                float Width,\n                float Height,\n                float Depth,\n                const glm::vec3& Color,\n                const glm::vec3& Emissive,\n                float Roughness\n            )\n            {\n                Boxes.push_back({\n                    Position,\n                    OrientedSize(Width, Height, Depth),\n                    Color,\n                    Emissive,\n                    Roughness,\n                    static_cast<int>(SurfaceMaterial::Fixture)\n                });\n            };\n\n            AddPiece(\n                BreakerData.Position +\n                    glm::vec3{0.0f, 0.48f, 0.0f},\n                0.66f,\n                0.96f,\n                0.18f,\n                {0.19f, 0.20f, 0.18f},\n                {0.0f, 0.0f, 0.0f},\n                0.62f\n            );\n\n            AddPiece(\n                BreakerData.Position +\n                    Forward * 0.12f +\n                    glm::vec3{0.0f, 0.48f, 0.0f},\n                0.54f,\n                0.80f,\n                0.055f,\n                {0.34f, 0.35f, 0.31f},\n                {0.0f, 0.0f, 0.0f},\n                0.48f\n            );\n\n            for (int Row = 0; Row < 3; ++Row)\n            {\n                for (int Column = 0; Column < 2; ++Column)\n                {\n                    const float Side =\n                        Column == 0 ? -0.14f : 0.14f;\n\n                    AddPiece(\n                        BreakerData.Position +\n                            Right * Side +\n                            Forward * 0.17f +\n                            glm::vec3{\n                                0.0f,\n                                0.28f + static_cast<float>(Row) * 0.20f,\n                                0.0f\n                            },\n                        0.105f,\n                        0.11f,\n                        0.075f,\n                        {0.055f, 0.057f, 0.052f},\n                        {0.0f, 0.0f, 0.0f},\n                        0.34f\n                    );\n                }\n            }\n\n            AddPiece(\n                BreakerData.Position +\n                    Forward * 0.18f +\n                    glm::vec3{0.0f, 0.84f, 0.0f},\n                0.075f,\n                0.075f,\n                0.06f,\n                BreakerData.Active\n                    ? glm::vec3{0.10f, 0.38f, 0.12f}\n                    : glm::vec3{0.42f, 0.08f, 0.05f},\n                BreakerData.Active\n                    ? glm::vec3{0.02f, 0.20f, 0.03f}\n                    : glm::vec3{0.18f, 0.015f, 0.008f},\n                0.25f\n            );\n        }\n    }\n\n    const glm::vec3 ExitRight{\n        ExitForward.z,\n        0.0f,\n        -ExitForward.x\n    };\n\n    const bool ExitFacingX =\n        std::abs(ExitForward.x) > 0.5f;\n\n    auto ExitSize = [&](\n        float Width,\n        float Height,\n        float Depth\n    )\n    {\n        return ExitFacingX\n            ? glm::vec3{Depth, Height, Width}\n            : glm::vec3{Width, Height, Depth};\n    };\n\n    auto AddExitPiece = [&](\n        const glm::vec3& Position,\n        float Width,\n        float Height,\n        float Depth,\n        const glm::vec3& Color,\n        const glm::vec3& Emissive,\n        float Roughness\n    )\n    {\n        Boxes.push_back({\n            Position,\n            ExitSize(Width, Height, Depth),\n            Color,\n            Emissive,\n            Roughness,\n            static_cast<int>(SurfaceMaterial::Fixture)\n        });\n    };\n\n    AddExitPiece(\n        ExitPosition + glm::vec3{0.0f, 1.20f, 0.0f},\n        1.22f,\n        2.40f,\n        0.14f,\n        {0.245f, 0.235f, 0.185f},\n        {0.0f, 0.0f, 0.0f},\n        0.72f\n    );\n\n    AddExitPiece(\n        ExitPosition +\n            ExitForward * 0.082f +\n            glm::vec3{0.0f, 1.22f, 0.0f},\n        0.92f,\n        1.78f,\n        0.035f,\n        {0.17f, 0.165f, 0.13f},\n        {0.0f, 0.0f, 0.0f},\n        0.66f\n    );\n\n    AddExitPiece(\n        ExitPosition -\n            ExitRight * 0.69f +\n            glm::vec3{0.0f, 1.25f, 0.0f},\n        0.13f,\n        2.50f,\n        0.23f,\n        {0.72f, 0.69f, 0.54f},\n        {0.0f, 0.0f, 0.0f},\n        0.58f\n    );\n\n    AddExitPiece(\n        ExitPosition +\n            ExitRight * 0.69f +\n            glm::vec3{0.0f, 1.25f, 0.0f},\n        0.13f,\n        2.50f,\n        0.23f,\n        {0.72f, 0.69f, 0.54f},\n        {0.0f, 0.0f, 0.0f},\n        0.58f\n    );\n\n    AddExitPiece(\n        ExitPosition + glm::vec3{0.0f, 2.46f, 0.0f},\n        1.51f,\n        0.13f,\n        0.23f,\n        {0.72f, 0.69f, 0.54f},\n        {0.0f, 0.0f, 0.0f},\n        0.58f\n    );\n\n    AddExitPiece(\n        ExitPosition +\n            ExitRight * 0.42f +\n            ExitForward * 0.13f +\n            glm::vec3{0.0f, 1.05f, 0.0f},\n        0.055f,\n        0.20f,\n        0.075f,\n        {0.58f, 0.56f, 0.43f},\n        {0.0f, 0.0f, 0.0f},\n        0.22f\n    );\n\n    AddExitPiece(\n        ExitPosition +\n            ExitForward * 0.14f +\n            glm::vec3{0.0f, 2.20f, 0.0f},\n        0.18f,\n        0.075f,\n        0.055f,\n        State.CanExit()\n            ? glm::vec3{0.10f, 0.44f, 0.12f}\n            : glm::vec3{0.48f, 0.09f, 0.055f},\n        State.CanExit()\n            ? glm::vec3{0.025f, 0.24f, 0.035f}\n            : glm::vec3{0.22f, 0.018f, 0.009f},\n        0.25f\n    );\n\n    if (!GameRenderer.HasEntityModels())'''
          game, count = dynamic_pattern.subn(dynamic_replacement, game, count=1)
          if count != 1:
              raise RuntimeError(f'dynamic object replacement count {count}')
          save(game_path, game)

          cmake_path = 'CMakeLists.txt'
          cmake = load(cmake_path)
          cmake = replace_once(cmake, 'VERSION 0.3.23', 'VERSION 0.3.24', 'cmake version')
          save(cmake_path, cmake)

          version_path = 'src/Core/Version.h'
          version = load(version_path)
          version = replace_once(version, 'Text = "0.3.23"', 'Text = "0.3.24"', 'build version')
          save(version_path, version)

          rc_path = 'src/Platform/Windows/Backrooms.rc'
          rc = load(rc_path)
          rc = rc.replace('0,3,23,0', '0,3,24,0')
          rc = rc.replace('0.3.23\\0', '0.3.24\\0')
          if '0.3.23' in rc or '0,3,23,0' in rc:
              raise RuntimeError('old Windows version remains')
          save(rc_path, rc)

          notes_path = 'update/release_notes.txt'
          save(
              notes_path,
              'V0.3.24 fixes the V0.3.23 native runtime regression: assets now resolve from the installed executable folder, recorded audio ships as decoder-safe PCM WAV with stronger audible levels, the exit is mounted into a maze wall and rendered as a proper framed door with handle and power lamp, and the breaker fallback is a recognizable multi-switch electrical panel instead of a plain dark block.\n'
          )

          credits_path = 'THIRD_PARTY_ASSETS.md'
          credits = load(credits_path).replace('.ogg', '.wav')
          credits = credits.replace(
              'Vendored as an OGG from the public fever-channels repository.',
              'Vendored from the public fever-channels repository and converted to PCM WAV for the native build.'
          )
          credits = credits.replace(
              'V0.3.23 and later use the recorded CC0 fluorescent hum and Kenney interaction/footstep recordings above as the primary native soundscape.',
              'V0.3.24 and later use PCM WAV conversions of the recorded fluorescent hum and Kenney interaction/footstep recordings above as the primary native soundscape.'
          )
          credits += '\n\n## Native audio packaging\n\n- V0.3.24 converts the credited recorded source files to mono 44.1 kHz PCM WAV at build-preparation time so the shipped native game does not depend on optional OGG/Vorbis decoder support.\n'
          save(credits_path, credits)

          workflow_path = Path('.github/workflows/v0324-regression-hotfix.yml')
          if workflow_path.exists():
              workflow_path.unlink()
          PY

      - name: Verify prepared source and assets
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/audio/fluorescent-hum.wav
          test -f assets/audio/breaker-trip.wav
          test -f assets/audio/footstep-carpet-1.wav
          test -f assets/audio/footstep-carpet-4.wav
          test -f assets/audio/entity-metal.wav
          test -f assets/models/power_box_01/power_box_01_1k.gltf
          test -f assets/models/power_box_01/power_box_01.bin
          ! find assets/audio -maxdepth 1 -name '*.ogg' -print -quit | grep -q .
          ! grep -R "0.3.23" CMakeLists.txt src/Core/Version.h src/Platform/Windows/Backrooms.rc update/release_notes.txt
          grep -q "0.3.24" CMakeLists.txt
          grep -q "std::filesystem::current_path" src/Core/Application.cpp
          grep -q "ExitForward" src/Game/Game.cpp
          grep -q "breaker-trip.wav" src/Audio/AudioSystem.cpp

      - name: Commit prepared V0.3.24 hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix V0.3.24 audio exit and breaker runtime [skip ci]"
          git push origin HEAD:fix-v0.3.24-audio-exit-breakers

  build-windows:
    needs: prepare
    runs-on: windows-2022
    steps:
      - name: Checkout prepared feature branch
        uses: actions/checkout@v4
        with:
          ref: fix-v0.3.24-audio-exit-breakers

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Verify executable and packaged runtime assets
        shell: pwsh
        run: |
          $Required = @(
            "build\Release\Backrooms Offical.exe",
            "build\Release\SDL3.dll",
            "build\Release\assets\audio\fluorescent-hum.wav",
            "build\Release\assets\audio\breaker-trip.wav",
            "build\Release\assets\audio\footstep-carpet-1.wav",
            "build\Release\assets\audio\footstep-carpet-4.wav",
            "build\Release\assets\audio\entity-metal.wav",
            "build\Release\assets\models\power_box_01\power_box_01_1k.gltf",
            "build\Release\assets\models\power_box_01\power_box_01.bin"
          )
          foreach ($Path in $Required) {
            if (!(Test-Path $Path)) {
              throw "Required runtime file missing: $Path"
            }
          }
          $Ogg = Get-ChildItem "build\Release\assets\audio" -Filter *.ogg -ErrorAction SilentlyContinue
          if ($Ogg) {
            throw "OGG audio unexpectedly remains in packaged runtime"
          }
