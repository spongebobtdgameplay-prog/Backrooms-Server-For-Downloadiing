name: Apply V0.3.13 Visual Menu Fixes

on:
  push:
    branches:
      - work/v0.3.13-visual-menu-fix
    paths:
      - tools/apply_v0313.py
      - .github/workflows/apply-v0313-fix.yml

permissions:
  contents: write

jobs:
  patch-build-promote:
    runs-on: windows-2022
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: work/v0.3.13-visual-menu-fix
          fetch-depth: 0

      - name: Apply V0.3.13 patch
        shell: pwsh
        run: python tools/apply_v0313.py

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "build\Release\Backrooms Offical.exe")) {
            throw "Backrooms Offical.exe was not produced"
          }
          if (!(Test-Path "build\Release\SDL3.dll")) {
            throw "SDL3.dll was not packaged"
          }

      - name: Promote clean V0.3.13 commit to main
        shell: pwsh
        run: |
          git fetch origin main
          $Expected = "669ff60485aa11f0185d79c56900fd057795a445"
          $Actual = (git rev-parse origin/main).Trim()
          if ($Actual -ne $Expected) {
            throw "main moved while V0.3.13 was being validated: $Actual"
          }

          Remove-Item "tools\apply_v0313.py" -Force
          Remove-Item ".github\workflows\apply-v0313-fix.yml" -Force

          git reset --soft origin/main
          git add -A
          git config user.name "spongebobtdgameplay-prog"
          git config user.email "spongebobtdgameplay@gmail.com"
          git commit -m "Restore menu visibility and rebalance Level 0 visuals in V0.3.13"
          git push origin HEAD:main
